# Production stack on a single host. The database is expected to be managed (RDS / Cloud SQL) and
# reached through DB_HOST in .env. Images are built in CI and pulled by tag: IMAGE_TAG=sha-abc1234.
#
#   docker compose -f docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
x-app: &app
  image: ghcr.io/${GITHUB_REPOSITORY:-your-org/accounting}/php:${IMAGE_TAG:-latest}
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage

services:
  app:
    <<: *app
    deploy:
      resources:
        limits:
          memory: 1536M

  web:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-org/accounting}/nginx:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          memory: 128M

  worker:
    <<: *app
    command: ["supervisord", "-c", "/var/www/html/docker/supervisor/supervisord.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' >/dev/null && pgrep -f 'schedule:work' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 130s
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  storage:
  redisdata:
