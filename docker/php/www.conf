[www]
pm = dynamic
; Size to RAM: each worker is roughly 40-60 MB for this app. 25 workers is about 1.2 GB.
pm.max_children = 25
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 500
pm.status_path = /status
ping.path = /ping
ping.response = pong
request_terminate_timeout = 60s
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
