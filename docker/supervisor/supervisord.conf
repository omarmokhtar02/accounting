[supervisord]
nodaemon=true
user=appuser
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:queue]
command=php /var/www/html/artisan queue:work %(ENV_QUEUE_CONNECTION)s --tries=3 --timeout=120 --sleep=1 --max-jobs=500 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
stopwaitsecs=130
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
